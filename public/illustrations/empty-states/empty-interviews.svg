<svg viewBox="0 0 210 180" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Calendar body -->
  <rect x="50" y="40" width="110" height="90" rx="6" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>

  <!-- Calendar header bar -->
  <rect x="50" y="40" width="110" height="20" rx="6" fill="currentColor" opacity="0.08"/>
  <line x1="50" y1="60" x2="160" y2="60" stroke="currentColor" stroke-width="1" opacity="0.3"/>

  <!-- Calendar month text (faint) -->
  <text x="105" y="54" text-anchor="middle" font-size="10" font-family="Arial" stroke="currentColor" opacity="0.25" fill="none">Sept 2026</text>

  <!-- Calendar grid (faint) -->
  <line x1="75" y1="60" x2="75" y2="130" stroke="currentColor" stroke-width="0.8" opacity="0.2"/>
  <line x1="100" y1="60" x2="100" y2="130" stroke="currentColor" stroke-width="0.8" opacity="0.2"/>
  <line x1="125" y1="60" x2="125" y2="130" stroke="currentColor" stroke-width="0.8" opacity="0.2"/>
  <line x1="150" y1="60" x2="150" y2="130" stroke="currentColor" stroke-width="0.8" opacity="0.2"/>

  <!-- Calendar week rows -->
  <line x1="50" y1="80" x2="160" y2="80" stroke="currentColor" stroke-width="0.8" opacity="0.2"/>
  <line x1="50" y1="100" x2="160" y2="100" stroke="currentColor" stroke-width="0.8" opacity="0.2"/>

  <!-- Clock overlay (cobalt accent) -->
  <g transform="translate(105, 95)">
    <!-- Clock circle -->
    <circle cx="0" cy="0" r="22" stroke="var(--cobalt, #2563eb)" stroke-width="2" opacity="0.7"/>
    <!-- Hour hand -->
    <line x1="0" y1="0" x2="0" y2="-12" stroke="var(--cobalt, #2563eb)" stroke-width="1.5" opacity="0.7"/>
    <!-- Minute hand -->
    <line x1="0" y1="0" x2="15" y2="0" stroke="var(--cobalt, #2563eb)" stroke-width="1.5" opacity="0.7"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="2" fill="var(--cobalt, #2563eb)" opacity="0.7"/>
  </g>

  <!-- Bottom accent -->
  <path d="M 60 145 Q 105 150 150 145" stroke="var(--lime, #d9f24a)" stroke-width="2" opacity="0.6"/>
</svg>
