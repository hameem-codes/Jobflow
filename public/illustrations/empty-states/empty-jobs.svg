<svg viewBox="0 0 210 180" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Briefcase body -->
  <rect x="45" y="50" width="120" height="75" rx="6" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>

  <!-- Briefcase handle -->
  <path d="M 60 50 Q 60 25 105 25 Q 150 25 150 50" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>

  <!-- Briefcase divider line -->
  <line x1="105" y1="50" x2="105" y2="125" stroke="currentColor" stroke-width="1" opacity="0.3"/>

  <!-- Left compartment details -->
  <circle cx="80" cy="75" r="8" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <circle cx="80" cy="100" r="8" stroke="currentColor" stroke-width="1" opacity="0.25"/>

  <!-- Right compartment details -->
  <rect x="125" y="70" width="20" height="25" rx="2" stroke="currentColor" stroke-width="1" opacity="0.3"/>

  <!-- Search icon (magnifying glass) in accent color -->
  <g transform="translate(105, 70)">
    <!-- Circle -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="var(--cobalt, #2563eb)" stroke-width="2" opacity="0.7"/>
    <!-- Handle -->
    <line x1="12" y1="12" x2="22" y2="22" stroke="var(--cobalt, #2563eb)" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Bottom accent line -->
  <path d="M 60 145 Q 105 150 150 145" stroke="var(--lime, #d9f24a)" stroke-width="2" opacity="0.6"/>
</svg>
